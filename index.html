<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EEF2F8">
<title>Votación en directo</title>
<link rel="icon" href="data:,">
<!--
  Página de voto de la votación en directo de la presentación (tecla V en la escena de retos).
  El QR de la presentación trae aquí con la sesión en la dirección (#s=<id>). Al elegir una opción se publica
  {"v": 1-4, "u": "<votante>"} en el tema aiimpact-<id> de ntfy.sh, que la presentación escucha. "u" es un identificador
  al azar guardado en este navegador: sirve para que, si alguien cambia de opinión, cuente solo su último voto.
  Un único fichero, sin dependencias. Cómo publicarla: README.md.
-->
<style>
  :root {
    --fondo: #EEF2F8;
    --texto: #2E404D;
    --suave: rgba(46, 64, 77, .74);
    --azul: #0072BC;
    --cielo: #19A3FC;
    --linea: rgba(46, 64, 77, .12);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--texto);
    background:
      radial-gradient(120% 70% at 88% -12%, rgba(25, 163, 252, .22), transparent 62%),
      radial-gradient(100% 60% at -12% 112%, rgba(0, 114, 188, .12), transparent 62%),
      var(--fondo);
    background-attachment: fixed;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
  }
  .antetitulo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--azul);
  }
  .antetitulo::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--cielo);
    box-shadow: 0 0 0 4px rgba(25, 163, 252, .18);
  }
  h1 { margin: 16px 0 8px; font-size: 26px; line-height: 1.22; }
  .indicacion { margin: 0 0 20px; font-size: 16px; line-height: 1.35; color: var(--suave); }

  .opciones { display: grid; gap: 12px; }
  .opcion {
    width: 100%;
    min-height: 74px;
    display: grid;
    grid-template-columns: 40px 1fr 24px;
    align-items: center;
    gap: 14px;
    margin: 0;
    padding: 14px 16px;
    border: 1px solid var(--linea);
    border-radius: 16px;
    background: #fff;
    color: var(--texto);
    font: bold 17px/1.25 Arial, Helvetica, sans-serif;
    letter-spacing: .03em;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(16, 40, 80, .04), 0 10px 24px -18px rgba(16, 40, 80, .32);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform .12s, background-color .2s, border-color .2s, box-shadow .2s, opacity .2s;
  }
  .opcion:active:not(:disabled) { transform: scale(.985); }
  .opcion:focus-visible { outline: 3px solid var(--cielo); outline-offset: 2px; }
  .opcion:disabled { cursor: default; }
  .texto { text-transform: uppercase; }
  .numero {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(0, 114, 188, .1);
    color: var(--azul);
    font-size: 18px;
    letter-spacing: 0;
  }
  .marca { position: relative; width: 24px; height: 24px; }
  /* elegida: azul de marca con una marca de verificación */
  .opcion[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #fff; box-shadow: 0 14px 28px -16px rgba(0, 114, 188, .75); }
  .opcion[aria-pressed="true"] .numero { background: #fff; }
  .opcion[aria-pressed="true"] .marca::after {
    content: '';
    position: absolute;
    left: 8px;
    top: 2px;
    width: 7px;
    height: 14px;
    border: solid #fff;
    border-width: 0 3px 3px 0;
    transform: rotate(45deg);
  }
  /* enviando: las demás se apagan y la elegida lleva un indicador que gira */
  .opciones.enviando .opcion:not(.en-curso) { opacity: .5; }
  .opcion.en-curso .marca::after {
    content: '';
    position: absolute;
    inset: 2px;
    border: 3px solid rgba(0, 114, 188, .22);
    border-top-color: var(--azul);
    border-radius: 50%;
    transform: none;
    animation: girar .8s linear infinite;
  }
  .opcion.en-curso[aria-pressed="true"] .marca::after { border-color: rgba(255, 255, 255, .35); border-top-color: #fff; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .sin-sesion .opcion { opacity: .45; }

  .estado {
    margin-top: 18px;
    padding: 16px 18px;
    border-radius: 14px;
    font-size: 16px;
    line-height: 1.4;
    background: rgba(255, 255, 255, .7);
    border: 1px solid var(--linea);
  }
  .estado[hidden] { display: none; }
  .estado.ok { background: rgba(0, 114, 188, .08); border-color: rgba(0, 114, 188, .18); }
  .estado.error { background: #fff; border-color: rgba(46, 64, 77, .28); }
  .estado-titulo { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font-size: 17px; font-weight: bold; }
  .estado-titulo::before { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 14px; line-height: 1; color: #fff; }
  .estado.ok .estado-titulo::before { content: '\2713'; background: var(--azul); }
  .estado.error .estado-titulo::before { content: '!'; background: var(--texto); }
  .estado-texto { margin: 0; color: var(--suave); }
  .estado-texto b { color: var(--texto); }
  .reintentar {
    margin-top: 14px;
    min-height: 48px;
    padding: 0 22px;
    border: 1.5px solid var(--azul);
    border-radius: 12px;
    background: #fff;
    color: var(--azul);
    font: bold 16px Arial, Helvetica, sans-serif;
    cursor: pointer;
    touch-action: manipulation;
  }
  .reintentar:focus-visible { outline: 3px solid var(--cielo); outline-offset: 2px; }

  .privacidad { display: flex; align-items: flex-start; gap: 8px; margin: 28px 0 0; font-size: 13px; line-height: 1.4; color: var(--suave); }
  .privacidad svg { flex: none; margin-top: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .opcion { transition: none; }
    .opcion.en-curso .marca::after { animation-duration: 2.4s; }
  }
</style>
</head>
<body>
<main>
  <p class="antetitulo">Votación en directo</p>
  <h1 id="pregunta">¿Cuál es el principal reto de vuestra organización con la IA?</h1>
  <p class="indicacion" id="indicacion">Elige una opción. Puedes cambiarla mientras la votación siga abierta.</p>

  <div class="opciones" id="opciones" role="group" aria-labelledby="pregunta">
    <button class="opcion" type="button" data-v="1" aria-pressed="false"><span class="numero">1</span><span class="texto">Escalar valor</span><span class="marca" aria-hidden="true"></span></button>
    <button class="opcion" type="button" data-v="2" aria-pressed="false"><span class="numero">2</span><span class="texto">Reinventar el trabajo</span><span class="marca" aria-hidden="true"></span></button>
    <button class="opcion" type="button" data-v="3" aria-pressed="false"><span class="numero">3</span><span class="texto">Rediseñar la organización</span><span class="marca" aria-hidden="true"></span></button>
    <button class="opcion" type="button" data-v="4" aria-pressed="false"><span class="numero">4</span><span class="texto">Activar el talento</span><span class="marca" aria-hidden="true"></span></button>
  </div>

  <div class="estado" id="estado" role="status" aria-live="polite" hidden></div>

  <p class="privacidad">
    <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M3 7V5a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="1" y="7" width="12" height="8.2" rx="2" fill="currentColor"/></svg>
    <span>Voto anónimo. No se guarda ningún dato personal.</span>
  </p>
</main>

<script>
(function () {
  'use strict';

  var NTFY = 'https://ntfy.sh/';
  var PREFIJO_TEMA = 'aiimpact-';
  var CLAVE_VOTANTE = 'aiimpact-votante';      // identificador anónimo de este navegador
  var CLAVE_VOTO = 'aiimpact-voto-';           // + sesión: el último voto enviado, para enseñarlo si se recarga
  var TIEMPO_MAXIMO = 10000;                   // ms para dar por fallido el envío
  var ALFABETO = 'abcdefghijkmnpqrstuvwxyz23456789';

  var grupo = document.getElementById('opciones');
  var opciones = Array.prototype.slice.call(grupo.querySelectorAll('.opcion'));
  var estado = document.getElementById('estado');
  var indicacion = document.getElementById('indicacion');

  var coincidencia = /(?:^#|&)s=([a-z0-9]{10,32})(?:&|$)/i.exec(location.hash);
  var sesion = coincidencia ? coincidencia[1].toLowerCase() : '';
  var enviando = false;
  var pendiente = 0;
  var votanteEnMemoria = '';

  function aleatorio(largo) {
    var bytes = crypto.getRandomValues(new Uint8Array(largo)), s = '';
    for (var i = 0; i < bytes.length; i++) s += ALFABETO[bytes[i] & 31];
    return s;
  }
  function leer(clave) { try { return localStorage.getItem(clave); } catch (e) { return null; } }
  function guardar(clave, valor) { try { localStorage.setItem(clave, valor); } catch (e) { /* navegación privada: solo en memoria */ } }

  function votante() {
    var id = leer(CLAVE_VOTANTE);
    if (!/^[a-z0-9]{16}$/.test(id || '')) {
      id = votanteEnMemoria || aleatorio(16);
      votanteEnMemoria = id;
      guardar(CLAVE_VOTANTE, id);
    }
    return id;
  }

  function nombre(v) { return opciones[v - 1].querySelector('.texto').textContent; }
  function marcar(v) { opciones.forEach(function (b, i) { b.setAttribute('aria-pressed', String(i + 1 === v)); }); }

  // tipo: ok | error | aviso; partes del texto: cadenas y { negrita: '…' }
  function mostrarEstado(tipo, titulo, partes, conReintento) {
    estado.className = 'estado ' + tipo;
    estado.textContent = '';
    var t = document.createElement('p');
    t.className = 'estado-titulo';
    t.textContent = titulo;
    estado.appendChild(t);
    if (partes && partes.length) {
      var p = document.createElement('p');
      p.className = 'estado-texto';
      partes.forEach(function (x) {
        if (typeof x === 'string') p.appendChild(document.createTextNode(x));
        else { var b = document.createElement('b'); b.textContent = x.negrita; p.appendChild(b); }
      });
      estado.appendChild(p);
    }
    if (conReintento) {
      var boton = document.createElement('button');
      boton.type = 'button';
      boton.className = 'reintentar';
      boton.textContent = 'Reintentar';
      boton.addEventListener('click', function () { enviar(pendiente); });
      estado.appendChild(boton);
    }
    estado.hidden = false;
  }

  function enviar(v) {
    if (enviando || !sesion || !(v >= 1 && v <= 4)) return;
    enviando = true;
    pendiente = v;
    grupo.classList.add('enviando');
    grupo.setAttribute('aria-busy', 'true');
    opciones.forEach(function (b) { b.disabled = true; });
    opciones[v - 1].classList.add('en-curso');

    var control = typeof AbortController === 'function' ? new AbortController() : null;
    var temporizador = setTimeout(function () { if (control) control.abort(); }, TIEMPO_MAXIMO);
    var peticion = navigator.onLine === false
      ? Promise.reject(new Error('sin red'))
      : fetch(NTFY + PREFIJO_TEMA + sesion, {
          method: 'POST',
          body: JSON.stringify({ v: v, u: votante() }),
          cache: 'no-store',
          credentials: 'omit',
          signal: control ? control.signal : undefined
        });

    peticion
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
      .then(function () {
        guardar(CLAVE_VOTO + sesion, String(v));
        marcar(v);
        mostrarEstado('ok', 'Voto registrado', ['Has votado ', { negrita: nombre(v) }, '. Si cambias de opinión, toca otra opción y contará la última.']);
      }, function () {
        mostrarEstado('error', 'No se ha podido enviar el voto', ['Tu voto por ', { negrita: nombre(v) }, ' no ha llegado. Comprueba la conexión del móvil y vuelve a intentarlo.'], true);
        var reintentar = estado.querySelector('.reintentar');
        if (reintentar) reintentar.focus();
      })
      .then(function () {
        clearTimeout(temporizador);
        enviando = false;
        grupo.classList.remove('enviando');
        grupo.removeAttribute('aria-busy');
        opciones.forEach(function (b) { b.disabled = false; b.classList.remove('en-curso'); });
      });
  }

  opciones.forEach(function (b) {
    b.addEventListener('click', function () { enviar(Number(b.getAttribute('data-v'))); });
  });
  window.addEventListener('hashchange', function () { location.reload(); });

  if (!sesion) {
    grupo.classList.add('sin-sesion');
    opciones.forEach(function (b) { b.disabled = true; });
    indicacion.textContent = '';
    mostrarEstado('aviso', 'No hay ninguna votación abierta en este enlace', ['Escanea el código QR que aparece en la presentación.']);
    return;
  }

  // si ya se votó en esta sesión (por ejemplo, al recargar), se enseña
  var anterior = Number(leer(CLAVE_VOTO + sesion));
  if (anterior >= 1 && anterior <= 4) {
    marcar(anterior);
    mostrarEstado('ok', 'Voto registrado', ['Has votado ', { negrita: nombre(anterior) }, '. Si cambias de opinión, toca otra opción y contará la última.']);
  }
})();
</script>
</body>
</html>
